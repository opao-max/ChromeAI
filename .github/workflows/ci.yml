name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'

jobs:
  typecheck-lint:
    name: Typecheck & Lint (chrome-crx)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chrome-crx
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund --workspaces=false

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm run test:coverage --if-present
